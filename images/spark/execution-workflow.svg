<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title description">
  <title id="title">Spark execution workflow</title>
  <desc id="description">RDD lineage is decomposed into stages. Narrow transformations are pipelined within Stage 1: Read, Map, Filter. A shuffle separates Stage 1 from Stage 2: Reduce, Map. Stage 1 produces four tasks for partitions 0 through 3. The task scheduler and coordinator assign task attempts to Workers A, B, and C.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #253247; }
      .title { font-size: 25px; font-weight: 700; }
      .heading { font-size: 20px; font-weight: 700; }
      .body { font-size: 19px; }
      .note { font-size: 17px; fill: #56657a; }
      .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .guide { fill: none; stroke: #64748b; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1120" height="660" rx="12" fill="#fff"/>
  <text x="32" y="44" class="title">RDD lineage → physical execution DAG</text>

  <!-- Plan stages from lineage. -->
  <rect x="32" y="82" width="296" height="540" rx="14" fill="#f5f8fc" stroke="#d5deea"/>
  <text x="180" y="119" text-anchor="middle" class="heading">RDD lineage</text>
  <path class="flow" d="M180 135 V157"/>
  <rect x="54" y="164" width="252" height="75" rx="9" fill="#e9effc" stroke="#9eafcf"/>
  <text x="180" y="194" text-anchor="middle" class="body">DAG decomposition</text>
  <text x="180" y="221" text-anchor="middle" class="heading">Stage generation</text>
  <path class="flow" d="M180 239 V304"/>
  <text x="196" y="266" class="note">Narrow vs. wide</text>
  <text x="196" y="288" class="note">dependencies</text>
  <rect x="54" y="312" width="252" height="85" rx="9" fill="#fff4d9" stroke="#d1ad59"/>
  <text x="180" y="344" text-anchor="middle" class="heading">Stage 1</text>
  <text x="180" y="375" text-anchor="middle" class="body">Read → Map → Filter</text>
  <path class="flow" d="M180 397 V436"/>
  <rect x="83" y="444" width="194" height="40" rx="20" fill="#f8e9ee" stroke="#d7a7b8"/>
  <text x="180" y="470" text-anchor="middle" class="body">Shuffle boundary</text>
  <path class="flow" d="M180 484 V519"/>
  <rect x="54" y="527" width="252" height="73" rx="9" fill="#fff4d9" stroke="#d1ad59"/>
  <text x="180" y="555" text-anchor="middle" class="heading">Stage 2</text>
  <text x="180" y="583" text-anchor="middle" class="body">Reduce → Map</text>

  <!-- One task per partition, with no invented worker placement. -->
  <text x="465" y="226" text-anchor="middle" class="heading">Stage 1 tasks</text>
  <text x="465" y="254" text-anchor="middle" class="note">One task per partition</text>
  <rect x="364" y="276" width="202" height="235" rx="12" fill="#fffdf5" stroke="#e4d6ab"/>
  <g class="body" text-anchor="middle">
    <rect x="380" y="292" width="170" height="40" rx="6" fill="#fff2c7"/><text x="465" y="318">Task 0 · Partition 0</text>
    <rect x="380" y="346" width="170" height="40" rx="6" fill="#fff2c7"/><text x="465" y="372">Task 1 · Partition 1</text>
    <rect x="380" y="400" width="170" height="40" rx="6" fill="#fff2c7"/><text x="465" y="426">Task 2 · Partition 2</text>
    <rect x="380" y="454" width="170" height="40" rx="6" fill="#fff2c7"/><text x="465" y="480">Task 3 · Partition 3</text>
  </g>
  <path class="flow" d="M306 355 H356"/>
  <path class="flow" d="M566 393 H622"/>

  <rect x="630" y="346" width="205" height="94" rx="12" fill="#f0ecfa" stroke="#b8a9d6"/>
  <text x="732" y="383" text-anchor="middle" class="heading">Task scheduler</text>
  <text x="732" y="414" text-anchor="middle" class="body">Coordinator</text>

  <text x="993" y="226" text-anchor="middle" class="heading">Execution</text>
  <path class="guide" d="M835 393 H874 M874 316 V470"/>
  <path class="flow" d="M874 316 H908"/>
  <path class="flow" d="M874 393 H908"/>
  <path class="flow" d="M874 470 H908"/>
  <g class="body" text-anchor="middle">
    <rect x="916" y="289" width="154" height="54" rx="9" fill="#edf6ec" stroke="#98b995"/><text x="993" y="323">Worker A</text>
    <rect x="916" y="366" width="154" height="54" rx="9" fill="#edf6ec" stroke="#98b995"/><text x="993" y="400">Worker B</text>
    <rect x="916" y="443" width="154" height="54" rx="9" fill="#edf6ec" stroke="#98b995"/><text x="993" y="477">Worker C</text>
  </g>
</svg>
